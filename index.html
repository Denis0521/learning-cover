  u.searchParams.set('openExternalBrowser','1');
  window.__extUrl=u.href;
  var isAndroid=/Android/i.test(ua);

    ?'intent://'+u.host+u.pathname+u.search+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u.href)+';end'

})();

<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Huninn','Noto Sans TC','PingFang TC',sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

#frame{position:absolute;top:214px;left:229px;width:336px;height:336px;background:#fff;border:12px solid #fff;

#school{position:absolute;top:580px;left:0;right:0;text-align:center;font-size:62px;letter-spacing:6px;line-height:1.2}

/* 透明白水晶輸入框（無底線） */

#wrap{margin:auto}
#panel{flex:none;width:100%;max-width:794px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--bd);border-radius:18px 18px 0 0}

/* ---- polished UI ---- */
#panel{background:linear-gradient(180deg,var(--panel),var(--bg));border:3px solid var(--bd);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -8px 24px rgba(120,70,0,.18),inset 0 3px 0 rgba(255,255,255,.7)}

.tabs{background:var(--bd);padding:5px;border-radius:22px;box-shadow:inset 0 3px 6px rgba(0,0,0,.18);gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.pane{background:var(--panel);border:2px solid var(--bd);border-radius:22px;padding:10px;box-shadow:inset 0 2px 5px rgba(0,0,0,.08)}
#fonts button,#fonts2 button,#fonts3 button{background:var(--bg);color:var(--tx);border:2px solid var(--bd);box-shadow:0 3px 0 var(--bd);text-shadow:none;border-radius:16px;padding:7px 12px;font-weight:400;font-size:16px}
#fonts button.sel,#fonts2 button.sel,#fonts3 button.sel{background:linear-gradient(180deg,#ffe29a,#ffc247);border-color:#ff9f1c;box-shadow:0 3px 0 #c76f00,inset 0 2px 0 rgba(255,255,255,.6)}
.mv button{width:46px;height:46px;padding:0;border-radius:50%;font-size:18px}
.sw{border-radius:50%!important;border:4px solid #fff!important;box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 2px var(--bd)!important}

#pwaBar .card{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--panel);color:var(--tx);border:3px solid var(--bd);border-radius:26px;padding:14px;box-shadow:0 -6px 28px rgba(0,0,0,.28);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.sw.sel{box-shadow:0 0 0 3px #ff9f1c}

#fshape button.sel{background:linear-gradient(180deg,#ffe29a,#ffc247);border-color:#ff9f1c;box-shadow:0 3px 0 #c76f00,inset 0 2px 0 rgba(255,255,255,.6)}

#pbLayer{position:absolute;inset:0;visibility:hidden;background:#fff8e6}

#ed{position:fixed;inset:0;z-index:99990;background:#1e1a16;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}

.edTop,.edBot{display:flex;gap:6px;align-items:center;padding:8px;color:#fff;flex:none}

// ===== 輸出 PDF 專用：用 Canvas 手繪糖果標題＋彩色輸入框 =====
function drawRowImg(row){
  const S=2,CW=438,CH=110,ox=45,oy=23;
  const cv=document.createElement('canvas');cv.width=CW*S;cv.height=CH*S;
  const x=cv.getContext('2d');x.scale(S,S);
  const cs=getComputedStyle(row),inp=row.querySelector('input'),ics=getComputedStyle(inp);
  const fam=cs.fontFamily,wt=cs.fontWeight,fc=ics.color;
  const rr=(a,b,w,h,r,k)=>{if(!k)x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
  const sh=(c,oyy,bl)=>{x.shadowColor=c;x.shadowOffsetY=oyy*S;x.shadowBlur=bl*S;x.shadowOffsetX=0};
  const noSh=()=>{x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0};
  /* 只畫在形狀外側（模擬 CSS 外陰影，透明水晶內部不會被陰影填滿） */
  const outside=(a,b,w,h,r,fn)=>{x.save();x.beginPath();x.rect(0,0,CW,CH);rr(a,b,w,h,r,true);x.clip('evenodd');fn();x.restore()};
  const lin=(x0,y0,x1,y1,stops)=>{const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(t=>g.addColorStop(t[0],t[1]));return g};
  x.font=`${wt} 38px ${fam}`;x.textBaseline='middle';x.textAlign='left';x.lineJoin='round';
  const place=(str,ls,startX,y,fn)=>{let cx=startX;for(const ch of str){fn(ch,cx,y);cx+=x.measureText(ch).width+ls}};
  const advW=(str,ls)=>[...str].reduce((a,ch)=>a+x.measureText(ch).width+ls,0);
  /* ---- 標題（純文字）---- */
  const lw=100,lh=64;
  const lab=row.querySelector('label').textContent,lls=4;
  x.font=`${wt} 40px ${fam}`;
  const lt=advW(lab,lls)-lls,lx=ox+(lw-lt)/2;
  x.fillStyle=fc;place(lab,lls,lx,oy+lh/2+1,(ch,cx,cy)=>x.fillText(ch,cx,cy));
  x.font=`${wt} 38px ${fam}`;
  /* ---- 透明白水晶輸入框 ---- */
  const fx=ox+lw+22,fw=226,fh=64;
  outside(fx-2,oy-2,fw+4,fh+4,28,()=>{rr(fx,oy+8,fw,fh,26);sh('rgba(120,150,190,.4)',6,14);x.fillStyle='rgba(150,180,215,.45)';x.fill();noSh()});
  rr(fx-1,oy-1,fw+2,fh+2,27);x.strokeStyle='rgba(160,190,230,.55)';x.lineWidth=2;x.stroke();
  x.save();rr(fx,oy,fw,fh,26);x.clip();
  x.fillStyle=lin(fx,oy,fx+fw,oy+fh,[[0,'rgba(255,255,255,.78)'],[.5,'rgba(255,255,255,.28)'],[1,'rgba(215,235,255,.65)']]);x.fillRect(fx,oy,fw,fh);
  x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=9;x.lineCap='butt';x.beginPath();x.moveTo(fx+34,oy+fh);x.lineTo(fx+34+fh*.55,oy);x.stroke();
  x.fillStyle=lin(0,oy,0,oy+6,[[0,'rgba(255,255,255,.95)'],[1,'rgba(255,255,255,0)']]);x.fillRect(fx,oy,fw,6);
  x.restore();
  rr(fx+1,oy+1,fw-2,fh-2,25);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.stroke();
  const ix=fx+6,iy=oy+6,iw=fw-12,ih=52;
  x.save();rr(ix,iy,iw,ih,20);x.clip();
  x.fillStyle=lin(0,iy,0,iy+ih,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,.2)']]);x.fillRect(ix,iy,iw,ih);
  x.fillStyle=lin(0,iy,0,iy+13,[[0,'rgba(120,150,190,.38)'],[1,'rgba(120,150,190,0)']]);x.fillRect(ix,iy,iw,13);
  x.restore();
  rr(ix+.5,iy+.5,iw-1,ih-1,19.5);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1;x.stroke();
  const val=inp.value;
  if(val){
    const ls=parseFloat(ics.letterSpacing)||0,ind=parseFloat(ics.textIndent)||0;
    const lineW=ind+advW(val,ls),sx=ix+8+((iw-16)-lineW)/2+ind,ty=iy+ih/2+1;
    x.fillStyle=fc;
    [['#fff',2,0],['rgba(0,0,0,.2)',12,8],['rgba(0,0,0,.28)',6,3]].forEach(a=>place(val,ls,sx,ty,(ch,cx,cy)=>{sh(a[0],a[1],a[2]);x.fillText(ch,cx,cy);noSh()}));
    place(val,ls,sx,ty,(ch,cx,cy)=>x.fillText(ch,cx,cy));
  }
  return cv.toDataURL('image/png');
}

async function getSeg(){
  if(_seg)return _seg;

  const fs=await V.FilesetResolver.forVisionTasks(MP_BASE+'/wasm');

/* 取得「人物機率」(0~1)；inv 未指定時自動判斷遮罩方向 */
function runSeg(seg,cv,inv){
  let P=null;
  const grab=r=>{
    const M=r&&r.confidenceMasks;if(!M||!M.length)return;
    let bi=-1;try{bi=seg.getLabels().findIndex(l=>/background/i.test(l))}catch(e){}
    const a=M[0].getAsFloat32Array(),n=a.length,p=new Float32Array(n);
    if(M.length>1&&bi>=0&&M[bi]){const b=M[bi].getAsFloat32Array();for(let i=0;i<n;i++)p[i]=1-b[i]}else p.set(a);
    P={p,w:M[0].width,h:M[0].height};
  };
  const ret=seg.segment(cv,grab);
  if(!P&&ret)grab(ret);
  if(!P)return null;
  const {p,w,h}=P;
  if(inv===undefined){/* 保險：人物機率在邊緣明顯比中間高 → 遮罩方向相反 */
    let ce=0,cn=0,re=0,rn=0;
    for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const v=p[y*w+x],fx=x/w,fy=y/h;
      if(fx>.25&&fx<.75&&fy>.25&&fy<.75){ce+=v;cn++}else if(fx<.08||fx>.92||fy<.08||fy>.92){re+=v;rn++}}
    inv=!!(cn&&rn&&re/rn>ce/cn+.3)}
  if(inv)for(let i=0;i<p.length;i++)p[i]=1-p[i];
  P.inv=inv;return P}

/* 第二輪：把人物範圍裁出來放大再辨識，並左右翻轉各跑一次取平均 → 邊緣更準 */

/* 均值濾波（半徑 r，邊界取實際範圍平均） */
